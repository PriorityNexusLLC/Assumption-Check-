name: Build entries and pages

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "domains/**"
      - "scripts/**"
      - "index.html"
  pull_request:
    paths:
      - "entries/**"
      - "domains/**"
      - "scripts/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check entries
        if: github.event_name == 'pull_request'
        run: |
          python scripts/build_entries.py
          python scripts/make_domains.py --check
          python scripts/connections.py

      - name: Build and commit
        if: github.event_name != 'pull_request'
        run: |
          python scripts/build_entries.py
          python scripts/build_site.py
          if git diff --quiet -- entries.js entry api domains Domains.html sitemap.xml robots.txt; then
            echo "generated files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entries.js entry api domains Domains.html sitemap.xml robots.txt
          git commit -m "Rebuild entries.js and the generated pages"
          git push
